<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#111C35" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgGrad2)"/>
  
  <!-- Network neural nodes in background -->
  <g stroke="#38BDF8" stroke-width="1.2" opacity="0.25">
    <line x1="120" y1="80" x2="220" y2="150" />
    <line x1="220" y1="150" x2="350" y2="90" />
    <line x1="350" y1="90" x2="480" y2="160" />
    <line x1="220" y1="150" x2="260" y2="280" />
    <line x1="350" y1="90" x2="420" y2="260" />
    <line x1="260" y1="280" x2="420" y2="260" />
  </g>
  <g fill="#00F0FF" opacity="0.6">
    <circle cx="120" cy="80" r="4" />
    <circle cx="220" cy="150" r="5" />
    <circle cx="350" cy="90" r="6" />
    <circle cx="480" cy="160" r="4" />
    <circle cx="260" cy="280" r="5" />
    <circle cx="420" cy="260" r="5" />
  </g>

  <!-- Central Interface Card -->
  <rect x="60" y="45" width="480" height="270" rx="16" fill="#0D1527" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2"/>
  
  <!-- Terminal / Chat header -->
  <rect x="60" y="45" width="480" height="36" rx="16" fill="#152039"/>
  <rect x="60" y="70" width="480" height="11" fill="#152039"/>
  <circle cx="85" cy="63" r="5" fill="#EF4444" />
  <circle cx="103" cy="63" r="5" fill="#F59E0B" />
  <circle cx="121" cy="63" r="5" fill="#10B981" />
  <text x="300" y="68" font-family="'Courier New', monospace" font-size="12" fill="#38BDF8" text-anchor="middle">ai_data_tool.py — [Python &amp; ML Insights]</text>

  <!-- Left: AI Analytics Chart -->
  <rect x="85" y="100" width="220" height="190" rx="10" fill="#111B30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="100" y="125" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#F1F5F9">Dataset Correlation</text>
  
  <!-- Mini Bar Chart -->
  <rect x="105" y="210" width="16" height="50" rx="3" fill="#00F0FF"/>
  <rect x="130" y="170" width="16" height="90" rx="3" fill="#38BDF8"/>
  <rect x="155" y="150" width="16" height="110" rx="3" fill="#6366F1"/>
  <rect x="180" y="185" width="16" height="75" rx="3" fill="#A855F7"/>
  <rect x="205" y="140" width="16" height="120" rx="3" fill="#EC4899"/>
  <rect x="230" y="195" width="16" height="65" rx="3" fill="#00F0FF"/>
  <line x1="95" y1="262" x2="290" y2="262" stroke="#475569" stroke-width="1"/>

  <!-- Right: AI Insight Prompts & Responses -->
  <rect x="320" y="100" width="200" height="85" rx="8" fill="#15223C"/>
  <text x="332" y="120" font-family="monospace" font-size="11" fill="#38BDF8">&gt; analyze(dataset)</text>
  <text x="332" y="140" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Key finding: 94.2% data trend accuracy detected.</text>
  <rect x="332" y="155" width="80" height="16" rx="4" fill="#0284C7" opacity="0.3"/>
  <text x="372" y="167" font-family="'Inter', sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle">Processed</text>

  <rect x="320" y="198" width="200" height="92" rx="8" fill="#15223C"/>
  <text x="332" y="220" font-family="monospace" font-size="11" fill="#10B981">&gt; generate_summary()</text>
  <text x="332" y="240" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Visual data pipeline and predictive insights ready.</text>
  <text x="332" y="270" font-family="'Inter', sans-serif" font-size="9" fill="#00F0FF">✨ 0.12s Execution Time</text>
</svg>
