<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgGrad1)"/>
  
  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
  </g>

  <!-- Browser/Window Mockup Frame -->
  <rect x="50" y="45" width="500" height="270" rx="14" fill="#0A0F1D" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="50" y="45" width="500" height="36" rx="14" fill="#131B2E"/>
  <rect x="50" y="70" width="500" height="11" fill="#131B2E"/>
  <circle cx="75" cy="63" r="5" fill="#EF4444" />
  <circle cx="95" cy="63" r="5" fill="#F59E0B" />
  <circle cx="115" cy="63" r="5" fill="#10B981" />
  <rect x="180" y="54" width="240" height="18" rx="6" fill="#1E293B"/>
  <text x="300" y="67" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">campus-connect.hackathon.io</text>

  <!-- Dashboard content -->
  <!-- Left mini sidebar -->
  <rect x="70" y="100" width="90" height="195" rx="8" fill="#162032"/>
  <rect x="82" y="115" width="66" height="10" rx="4" fill="#38BDF8" opacity="0.8"/>
  <rect x="82" y="135" width="50" height="8" rx="3" fill="#64748B"/>
  <rect x="82" y="152" width="58" height="8" rx="3" fill="#64748B"/>
  <rect x="82" y="169" width="45" height="8" rx="3" fill="#64748B"/>
  <rect x="82" y="186" width="52" height="8" rx="3" fill="#64748B"/>

  <!-- Main Dashboard Area -->
  <rect x="175" y="100" width="355" height="75" rx="10" fill="#162238" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
  <!-- Trophy / Badge icon -->
  <circle cx="215" cy="138" r="22" fill="#0284C7" opacity="0.3"/>
  <text x="215" y="145" font-family="sans-serif" font-size="20" text-anchor="middle">🏆</text>
  <text x="250" y="130" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Smart Campus Connect</text>
  <text x="250" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#38BDF8">JECRC University Hackathon Prototype</text>

  <!-- Stat cards -->
  <rect x="175" y="190" width="110" height="105" rx="8" fill="#162032"/>
  <text x="190" y="215" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Active Users</text>
  <text x="190" y="245" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#00F0FF">1,240+</text>
  <rect x="190" y="265" width="80" height="6" rx="3" fill="#00F0FF" opacity="0.5"/>

  <rect x="295" y="190" width="110" height="105" rx="8" fill="#162032"/>
  <text x="310" y="215" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Efficiency</text>
  <text x="310" y="245" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#10B981">98.4%</text>
  <rect x="310" y="265" width="80" height="6" rx="3" fill="#10B981" opacity="0.5"/>

  <rect x="415" y="190" width="115" height="105" rx="8" fill="#162032"/>
  <text x="430" y="215" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">API Speed</text>
  <text x="430" y="245" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#818CF8">42ms</text>
  <rect x="430" y="265" width="85" height="6" rx="3" fill="#818CF8" opacity="0.5"/>
</svg>
