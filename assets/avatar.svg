<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background circle -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6 8" opacity="0.3" />

  <!-- Background Tech Elements -->
  <g opacity="0.25">
    <text x="50" y="90" font-family="monospace" font-size="14" fill="#00F0FF">&lt;developer&gt;</text>
    <text x="280" y="120" font-family="monospace" font-size="14" fill="#6366F1">{ CSE: '2029' }</text>
    <text x="40" y="310" font-family="monospace" font-size="14" fill="#38BDF8">python() =&gt; AI</text>
    <text x="260" y="320" font-family="monospace" font-size="14" fill="#00F0FF">&lt;/code&gt;</text>
  </g>

  <!-- Body / Hoodie -->
  <path d="M 110 370 C 110 290 145 265 200 265 C 255 265 290 290 290 370 Z" fill="#1E293B" stroke="url(#accentGrad)" stroke-width="2"/>
  <path d="M 155 265 L 200 330 L 245 265" fill="#0F172A" opacity="0.8"/>
  <path d="M 198 280 L 198 340" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="182" y="220" width="36" height="48" rx="6" fill="#F59E0B" opacity="0.9"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="48" ry="58" fill="url(#skinGrad)" />

  <!-- Modern Hair -->
  <path d="M 150 165 C 145 125 170 110 200 110 C 235 110 255 125 252 165 C 242 140 235 130 200 130 C 170 130 158 142 150 165 Z" fill="#0F172A" />
  <!-- Hair volume top -->
  <path d="M 158 135 C 165 105 210 95 240 115 C 248 120 252 130 252 140 C 235 125 215 120 185 125 C 170 128 162 132 158 135 Z" fill="#1E293B" />

  <!-- Glasses -->
  <rect x="164" y="165" width="28" height="18" rx="5" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <rect x="208" y="165" width="28" height="18" rx="5" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <line x1="192" y1="174" x2="208" y2="174" stroke="#00F0FF" stroke-width="2.5" />
  <path d="M 164 172 L 152 168" stroke="#00F0FF" stroke-width="2" />
  <path d="M 236 172 L 248 168" stroke="#00F0FF" stroke-width="2" />

  <!-- Eyes behind glasses -->
  <circle cx="178" cy="174" r="3.5" fill="#0F172A"/>
  <circle cx="222" cy="174" r="3.5" fill="#0F172A"/>

  <!-- Smile -->
  <path d="M 188 208 Q 200 218 212 208" fill="none" stroke="#92400E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Headphones -->
  <path d="M 148 180 A 55 55 0 0 1 252 180" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <rect x="142" y="165" width="10" height="26" rx="4" fill="#00F0FF" />
  <rect x="248" y="165" width="10" height="26" rx="4" fill="#00F0FF" />

  <!-- Glowing floating tech badge -->
  <g transform="translate(280, 240)">
    <circle cx="20" cy="20" r="24" fill="#0F172A" stroke="#00F0FF" stroke-width="2" filter="url(#softGlow)"/>
    <text x="20" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#00F0FF" text-anchor="middle">AI</text>
  </g>
  <g transform="translate(80, 240)">
    <circle cx="20" cy="20" r="24" fill="#0F172A" stroke="#38BDF8" stroke-width="2" filter="url(#softGlow)"/>
    <text x="20" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
